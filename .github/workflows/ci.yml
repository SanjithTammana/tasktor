name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test (.NET)
        if: hashFiles('Tasktor.sln') != ''
        run: |
          dotnet build Tasktor.sln -c Release -warnaserror -p:EnableWindowsTargeting=true
          dotnet test Tasktor.sln -c Release --no-build
      - name: Test (Python worker)
        if: hashFiles('worker/requirements.txt') != ''
        run: |
          pip install -r worker/requirements.txt
          pytest worker
      - name: Nothing to build yet
        if: hashFiles('Tasktor.sln') == ''
        run: echo "No solution yet (M0 creates it)."

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and test (.NET, all projects)
        if: hashFiles('Tasktor.sln') != ''
        run: |
          dotnet build Tasktor.sln -c Release -warnaserror
          dotnet test Tasktor.sln -c Release --no-build
