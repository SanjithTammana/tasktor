name: ci

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a newer push cancels the run it replaces (fewer duplicate failure emails).
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (.NET, everything except Flyout / Widget)
        run: dotnet build Tasktor.Linux.slnf -c Release -warnaserror
      - name: Test (.NET)
        run: dotnet test Tasktor.Linux.slnf -c Release --no-build
      - name: Test (Python worker)
        if: hashFiles('worker/requirements.txt') != ''
        run: |
          pip install -r worker/requirements.txt
          pytest worker

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build (.NET, all projects)
        run: dotnet build Tasktor.sln -c Release -warnaserror
      - name: Test (.NET)
        run: dotnet test Tasktor.sln -c Release --no-build
      - name: G-net runtime (the agent never connects, with every Module on)
        shell: pwsh
        run: ./scripts/gnet-runtime.ps1
      - name: Windows integration (DPAPI, winsqlite3 WAL, pipe ACL, Job Object, capture supervision)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./scripts/windows-integration.ps1
      - name: G-aot (Native AOT publish of the agent, no trim / AOT warnings)
        if: ${{ !cancelled() }}
        run: dotnet publish src/Tasktor.Agent/Tasktor.Agent.csproj -c Release -r win-x64 -p:PublishAot=true -warnaserror -o out/agent-aot
