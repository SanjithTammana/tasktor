<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasktor</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --surface: #fbfbfb;
      --border: #d9d9d9;
      --ink: #111111;
      --muted: #3d3d3d;
      --button: #fbfbfb;
      --accent: #005fb8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #1c1c1c;
        --surface: #2b2b2b;
        --border: #3a3a3a;
        --ink: #ffffff;
        --muted: #d6d6d6;
        --button: #2d2d2d;
        --accent: #60cdff;
      }
    }
    * { box-sizing: border-box; }
    html { width: 340px; max-width: 100vw; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--background);
      color: var(--ink);
      font: 14px/20px "Segoe UI Variable Text", "Segoe UI", sans-serif;
      overflow-wrap: anywhere;
    }
    main { display: flex; flex-direction: column; gap: 12px; }
    header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    header strong { font-weight: 600; }
    header span { color: var(--muted); font-size: 12px; }
    p { margin: 0; }
    #status { font-size: 18px; line-height: 25px; }
    .actions { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .actions button + button { border-top: 1px solid var(--border); }
    button {
      min-height: 44px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      text-align: left;
      overflow-wrap: anywhere;
      cursor: pointer;
    }
    button:hover:not(:disabled) { background: var(--button); }
    button:disabled { color: var(--muted); cursor: default; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
    .privacy { display: flex; align-items: flex-start; gap: 8px; color: var(--ink); }
    .privacy input { flex: none; margin: 3px 0 0; accent-color: var(--accent); }
    #private-hint { color: var(--muted); font-size: 12px; line-height: 16px; }
    @media (forced-colors: active) {
      :root { --background: Canvas; --surface: Canvas; --button: Canvas; --border: CanvasText; --ink: CanvasText; --muted: CanvasText; --accent: Highlight; }
      button:disabled { color: GrayText; }
    }
  </style>
</head>
<body>
<main>
  <header><strong>Tasktor</strong></header>
  <p id="status">Connecting to Tasktor…</p>
  <div class="actions">
    <button id="site" type="button">Never capture this site</button>
    <button id="tab" type="button">Pause for this tab</button>
  </div>
  <label class="privacy"><input type="checkbox" id="private"> <span>Also capture private windows in this browser profile</span></label>
  <p id="private-hint" hidden>First turn on “Allow in Incognito” (Edge: “Allow in InPrivate”) on this extension’s details page.</p>
</main>
<script type="module" src="popup.js"></script>
</body>
</html>
