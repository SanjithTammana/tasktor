[project]
name = "tasktor-worker"
version = "0.1.0"
description = "Tasktor learning worker and the tasktor_data export loader"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["numpy>=2.0", "scikit-learn>=1.5", "pandas>=2.2"]

[project.optional-dependencies]
test = ["pytest>=8.0", "jsonschema>=4.22"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tasktor_worker", "tasktor_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
